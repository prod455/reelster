<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reelster</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1 id="title"></h1>
    <p id="keep-open"></p>
    <form id="setup">
      <fieldset class="period">
        <legend id="period-legend"></legend>
        <label><span id="from-label"></span> <input id="from" type="date"></label>
        <label><span id="to-label"></span> <input id="to" type="date"></label>
      </fieldset>
      <p id="period-hint"></p>
      <button id="start" type="submit"></button>
    </form>
    <progress id="progress" hidden></progress>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <p id="diagnostics" class="diagnostics"></p>
    <ul id="failures" class="failures"></ul>
    <button id="stop" type="button" hidden></button>
    <button id="save" type="button" hidden></button>
  </main>
  <script type="module" src="export.js"></script>
</body>
</html>
